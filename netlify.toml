[build]
  # Set the base directory to your Angular project
  base = "personal-finance-pwa"
  
  # Build command to run
  command = "npm ci && npm run build"
  
  # Directory with the built files (relative to base directory)
  publish = "dist/personal-finance-pwa/browser"
  
  # Netlify Functions directory
  functions = "netlify/functions"

# Environment variables (set these in Netlify Dashboard)
# FIREBASE_PROJECT_ID - Your Firebase project ID
# FIREBASE_CLIENT_EMAIL - Firebase service account email
# FIREBASE_PRIVATE_KEY - Firebase service account private key

# Redirect all requests to index.html for Angular routing
# Note: /.netlify/* paths are automatically excluded by Netlify
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for PWA and security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' accounts.google.com apis.google.com checkout.razorpay.com www.gstatic.com; style-src 'self' 'unsafe-inline' accounts.google.com fonts.googleapis.com; font-src 'self' fonts.gstatic.com data:; img-src 'self' data: *.googleapis.com *.gstatic.com; connect-src 'self' *.googleapis.com *.firebaseapp.com *.firebaseio.com wss://*.firebaseio.com api.razorpay.com accounts.google.com; frame-src accounts.google.com checkout.razorpay.com *.firebaseapp.com; worker-src 'self'; manifest-src 'self'"

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Service Worker should not be cached
[[headers]]
  for = "/ngsw-worker.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/ngsw.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Firebase Messaging Service Worker should not be cached
[[headers]]
  for = "/firebase-messaging-sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

# Manifest file
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[functions."send-reminders"]
  schedule = "*/30 * * * *"
