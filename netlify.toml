[build]
  # Set the base directory to your Angular project
  base = "personal-finance-pwa"
  
  # Build command to run
  command = "npm ci && npm run build"
  
  # Directory with the built files (relative to base directory)
  publish = "dist/personal-finance-pwa/browser"
  
  # Netlify Functions directory
  functions = "netlify/functions"

[functions]
  # Exclude test files from deployment
  included_files = ["!**/*.test.ts", "!**/*.spec.ts"]

# Environment variables (set these in Netlify Dashboard)
# FIREBASE_PROJECT_ID - Your Firebase project ID
# FIREBASE_CLIENT_EMAIL - Firebase service account email
# FIREBASE_PRIVATE_KEY - Firebase service account private key

# Redirect all requests to index.html for Angular routing
# Note: /.netlify/* paths are automatically excluded by Netlify
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for PWA and security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Service Worker should not be cached
[[headers]]
  for = "/ngsw-worker.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/ngsw.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Firebase Messaging Service Worker should not be cached
[[headers]]
  for = "/firebase-messaging-sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

# Manifest file
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[functions."send-reminders"]
  schedule = "0 * * * *"
