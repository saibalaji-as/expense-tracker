<svg width="512" height="512" viewBox="0 0 680 680" xmlns="http://www.w3.org/2000/svg">
  <title>Spenza</title>
  <defs>
    <linearGradient id="squircleG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6d28d9"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="shineG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="55%"  stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="rimG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#a78bfa" stop-opacity="1"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="rupeeG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#ede9fe"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="trendG" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="dotG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="ambientBloom">
      <feGaussianBlur stdDeviation="22" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="lineBloom">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="dotBloom">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="rupeeBloom">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="sq">
      <rect x="120" y="120" width="440" height="440" rx="110" ry="110"/>
    </clipPath>
  </defs>

  <g filter="url(#ambientBloom)">
    <rect x="120" y="120" width="440" height="440" rx="110" ry="110"
          fill="url(#squircleG)" opacity="0.35"/>
  </g>

  <rect x="120" y="120" width="440" height="440" rx="110" ry="110"
        fill="url(#squircleG)" opacity="0.72"/>
  <rect x="120" y="120" width="440" height="440" rx="110" ry="110"
        fill="url(#shineG)"/>

  <g clip-path="url(#sq)">
    <ellipse cx="255" cy="188" rx="190" ry="55" fill="#ffffff" opacity="0.06"/>
    <text font-family="Georgia,serif" font-weight="900" font-size="320"
          fill="#ffffff" text-anchor="middle" x="344" y="475" opacity="0.06">₹</text>
  </g>

  <rect x="120" y="120" width="440" height="440" rx="110" ry="110"
        fill="none" stroke="url(#rimG)" stroke-width="2"/>
  <rect x="124" y="124" width="432" height="432" rx="108" ry="108"
        fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.12"/>

  <g filter="url(#rupeeBloom)">
    <text font-family="Georgia,serif" font-weight="900" font-size="232"
          fill="url(#rupeeG)" text-anchor="middle" x="338" y="442" opacity="0.18">₹</text>
  </g>
  <text font-family="Georgia,serif" font-weight="900" font-size="232"
        fill="url(#rupeeG)" text-anchor="middle" x="338" y="442" opacity="0.95">₹</text>

  <g filter="url(#lineBloom)">
    <polyline points="178,495  244,418  306,446  374,336  440,276  504,192"
              fill="none" stroke="url(#trendG)" stroke-width="10"
              stroke-linecap="round" stroke-linejoin="round" opacity="0.45"/>
  </g>
  <polyline points="178,495  244,418  306,446  374,336  440,276  504,192"
            fill="none" stroke="url(#trendG)" stroke-width="4.5"
            stroke-linecap="round" stroke-linejoin="round"/>

  <circle cx="374" cy="336" r="16" fill="#a78bfa" opacity="0.22"/>
  <circle cx="374" cy="336" r="7"  fill="#c4b5fd"/>

  <g filter="url(#dotBloom)">
    <circle cx="504" cy="192" r="22" fill="url(#dotG)" opacity="0.45"/>
  </g>
  <circle cx="504" cy="192" r="12" fill="url(#dotG)"/>
  <circle cx="504" cy="192" r="5"  fill="#3b0764"/>
  <polygon points="504,163  518,192  504,182  490,192" fill="url(#dotG)" opacity="0.95"/>
</svg>
