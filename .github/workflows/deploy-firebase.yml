name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: personal-finance-pwa/package-lock.json

      - name: Write environment.prod.ts
        working-directory: personal-finance-pwa
        env:
          NETLIFY_FUNCTIONS_URL: ${{ secrets.NETLIFY_FUNCTIONS_URL }}
          FIREBASE_FUNCTIONS_URL: ${{ secrets.FIREBASE_FUNCTIONS_URL }}
        run: |
          node -e "
            const fs = require('fs');
            fs.writeFileSync('src/environments/environment.prod.ts',
              \`export const environment = {
            production: true,
            netlifyFunctionsUrl: '\${process.env.NETLIFY_FUNCTIONS_URL}',
            firebaseFunctionsUrl: '\${process.env.FIREBASE_FUNCTIONS_URL}',
          };\`
            );
          "

      - name: Install dependencies
        working-directory: personal-finance-pwa
        run: npm ci

      - name: Build
        working-directory: personal-finance-pwa
        run: npm run build -- --configuration production

      - name: Install Firebase Functions dependencies
        working-directory: personal-finance-pwa/functions
        run: npm ci

      - name: Build Firebase Functions
        working-directory: personal-finance-pwa/functions
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy Firebase Hosting and subscription Functions
        working-directory: personal-finance-pwa
        run: npx firebase-tools@latest deploy --only hosting:spenza-site,functions:createSubscriptionHandoff,functions:redeemSubscriptionHandoff,functions:createRazorpaySubscription,functions:verifyRazorpayPayment,functions:razorpayWebhook --project spenza-notifications --non-interactive
